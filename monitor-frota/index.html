<style>
/* Layout: faixa de resumo da frota no topo, grade de celulares, e o detalhe do celular abre abaixo com grafico do dia + linha do tempo. */
:root {
  --bg: #eef1f4;
  --panel: #ffffff;
  --ink: #17212b;
  --muted: #5b6875;
  --line: #d5dce3;
  --accent: #0d6c8c;
  --accent-soft: #e0eff4;
  --good: #1d7a46;
  --good-soft: #e1f2e8;
  --warn: #a35c00;
  --warn-soft: #fbeedb;
  --crit: #b3261e;
  --crit-soft: #fbe3e1;
  --chart-grid: #e3e8ed;
  --f-display: "IBM Plex Sans Condensed", "Arial Narrow", sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11171d; --panel: #18212a; --ink: #e4eaf0; --muted: #93a1ae; --line: #2a3742;
  --accent: #4fb3d4; --accent-soft: #15303b; --good: #5cc98a; --good-soft: #15301f;
  --warn: #e7a443; --warn-soft: #36280f; --crit: #f07b72; --crit-soft: #3a1a18; --chart-grid: #24303a;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #11171d; --panel: #18212a; --ink: #e4eaf0; --muted: #93a1ae; --line: #2a3742;
  --accent: #4fb3d4; --accent-soft: #15303b; --good: #5cc98a; --good-soft: #15301f;
  --warn: #e7a443; --warn-soft: #36280f; --crit: #f07b72; --crit-soft: #3a1a18; --chart-grid: #24303a;
  color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 40px; }
.wrap { max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; }
h1 { font-size: 24px; font-weight: 700; letter-spacing: .01em; }
h2 { font-size: 17px; font-weight: 600; }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.label { font-family: var(--f-display); font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding-top: 20px; }
.top .meta { color: var(--muted); font-size: 13px; }
.top .actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 7px 12px; font-size: 13px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--panel); font-weight: 600; }

.banner { border: 1px dashed var(--warn); background: var(--warn-soft); color: var(--ink); border-radius: 8px; padding: 10px 14px; font-size: 13px; }

.summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.summary div { background: var(--panel); padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
.summary .v { font-family: var(--f-display); font-size: 26px; font-weight: 700; line-height: 1.1; }
.summary .v.good { color: var(--good); } .summary .v.warn { color: var(--warn); } .summary .v.crit { color: var(--crit); }

.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.toolbar input[type=search] { flex: 1 1 220px; min-width: 0; border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 8px 10px; }
.chip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 5px 11px; font-size: 12.5px; }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); font-weight: 600; }

.main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 20px; align-items: start; }
@media (max-width: 900px) { .main { grid-template-columns: minmax(0, 1fr); } }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; text-align: left; position: relative; }
.card:hover { border-color: var(--accent); }
.card.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.card .head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.card .name { font-family: var(--f-display); font-weight: 600; font-size: 16px; overflow-wrap: anywhere; }
.pill { font-size: 11.5px; font-weight: 600; border-radius: 999px; padding: 2px 8px; white-space: nowrap; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.crit { background: var(--crit-soft); color: var(--crit); }
.pill.muted { background: var(--bg); color: var(--muted); }
.batt { display: flex; align-items: center; gap: 10px; }
.batt .bar { flex: 1; height: 10px; border-radius: 3px; background: var(--bg); border: 1px solid var(--line); overflow: hidden; }
.batt .bar i { display: block; height: 100%; }
.batt .pct { font-family: var(--f-mono); font-weight: 500; font-size: 15px; min-width: 44px; text-align: right; }
.facts { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 3px 10px; font-size: 12.5px; margin: 0; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; overflow-wrap: anywhere; }
.facts .bad { color: var(--crit); font-weight: 600; }
.facts .attn { color: var(--warn); font-weight: 600; }
.card .seen { font-size: 12px; color: var(--muted); }

aside.feed { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; display: flex; flex-direction: column; max-height: 78vh; min-width: 0; }
aside.feed header { padding: 12px 14px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.events { list-style: none; margin: 0; padding: 0; overflow-y: auto; }
.events li { display: grid; grid-template-columns: 4px minmax(0, 1fr); gap: 10px; padding: 9px 14px 9px 0; border-bottom: 1px solid var(--line); }
.events li .sev { border-radius: 0 2px 2px 0; }
.events .sev.crit { background: var(--crit); } .events .sev.warn { background: var(--warn); } .events .sev.info { background: var(--line); }
.events .when { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); }
.events .msg { font-size: 13px; overflow-wrap: anywhere; }
.events .who { font-family: var(--f-display); font-weight: 600; font-size: 12.5px; }
.empty { padding: 20px 14px; color: var(--muted); font-size: 13px; }

section.detail { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
.detail .dhead { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; }
.detail .dhead input { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 6px 8px; }
.chartbox { overflow-x: auto; }
.chartbox svg { display: block; width: 100%; min-width: 560px; height: auto; }
.chartbox text { fill: var(--muted); font-family: var(--f-mono); font-size: 10.5px; }
.detail .cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 760px) { .detail .cols { grid-template-columns: minmax(0, 1fr); } }
.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; font-size: 13px; margin: 0; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; overflow-wrap: anywhere; }
.kv dd.bad { color: var(--crit); font-weight: 600; }
.calib { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; margin-top: 6px; }
.calib label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); }
.calib select, .calib input { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 6px; padding: 6px 8px; }
.calib input { width: 90px; }
.calib-note { flex-basis: 100%; font-size: 12px; color: var(--muted); }
.detail .events { max-height: 420px; border: 1px solid var(--line); border-radius: 6px; }

dialog { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--ink); padding: 20px; width: min(440px, calc(100vw - 32px)); }
dialog::backdrop { background: rgb(0 0 0 / .35); }
dialog form { display: flex; flex-direction: column; gap: 10px; }
dialog label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
dialog input { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 8px 10px; color: var(--ink); }
dialog .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 6px; }
.err { color: var(--crit); font-size: 13px; min-height: 1em; }
@media (prefers-reduced-motion: no-preference) { .card, .btn, .chip { transition: border-color .15s, background .15s; } }

/* abas */
.tabs { display: flex; gap: 6px; border-bottom: 1px solid var(--line); margin: 4px 0 14px; }
.tab { border: 0; background: none; color: var(--muted); font: inherit; font-weight: 600; padding: 9px 14px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab:hover { color: var(--ink); }

/* aba eventos */
.evgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.evcard { text-align: left; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); padding: 12px 14px; cursor: pointer; }
.evcard:hover { border-color: var(--accent); }
.evcard.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.evcard .n { font: 600 26px/1 "IBM Plex Sans Condensed", sans-serif; }
.evcard .n.crit { color: var(--crit); } .evcard .n.warn { color: var(--warn); } .evcard .n.info { color: var(--muted); }
.evcard .lbl { display: block; margin-top: 4px; font-size: 13px; }
.evcard .sub { display: block; margin-top: 2px; font-size: 11.5px; color: var(--muted); }
.evdetail { margin-top: 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); padding: 16px; }
.evdetail table { width: 100%; border-collapse: collapse; font-size: 13px; }
.evdetail th, .evdetail td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.evdetail th { color: var(--muted); font-weight: 600; }
.evdetail .byveh { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 14px; }
.evdetail .byveh span { font-size: 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 20px; padding: 3px 10px; }

/* aba configurações */
.cfgcard { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); padding: 16px 18px; max-width: 760px; }
.cfggrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px 16px; margin-top: 10px; }
.cfggrid label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
.cfggrid input, .cfggrid select { border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 6px; padding: 8px 10px; font: inherit; }
.cfg-hint { font-size: 12px; color: var(--muted); margin-top: 2px; }
</style>

<script>
// Conexao fixa do painel. A chave abaixo e publica. O painel abre so com o codigo 8015
// (conferido aqui no navegador) e le os dados direto com a chave — sem conta de login no Supabase.
const CONFIG = {
  url: "https://orhuxmsrdnugpogvtnbg.supabase.co",
  key: "sb_publishable_Hu4Ns0jDTesWzDmVseAl_Q_ubCJa5wL"
};
// sha256("8015") — mesmo codigo admin do aplicativo.
const ADMIN_PIN_SHA256 = "0eadf1d576bd3ec3f0e6d305a44136b198701bf1f369a001a848c4c561b3c0e6";
async function codeOk(code) {
  if (window.crypto && crypto.subtle) {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(code));
    const hex = Array.from(new Uint8Array(buf)).map(x => x.toString(16).padStart(2, "0")).join("");
    return hex === ADMIN_PIN_SHA256;
  }
  return code === "8015"; // reserva, caso abra como arquivo local (sem https)
}

const TZ = "America/Belem";
const ONLINE_MIN = 10, LATE_MIN = 60;
const EVENT_INFO = {
  carregador_fraco: ["crit", "Carregador fraco"], nao_carrega: ["crit", "Não está carregando"],
  hotspot_ligado: ["crit", "Hotspot ligado"], hotspot_clientes: ["warn", "Aparelhos no hotspot"],
  hotspot_desligado: ["info", "Hotspot desligado"], bateria_critica: ["crit", "Bateria crítica"],
  bateria_baixa: ["warn", "Bateria baixa"], servico_parado: ["crit", "Monitor parado"],
  bluetooth_desligado: ["warn", "Bluetooth desligado"], bluetooth_ligado: ["info", "Bluetooth ligado"],
  bt_conectado: ["warn", "Bluetooth conectado"], bt_desconectado: ["info", "Bluetooth desconectado"],
  bt_pareado: ["crit", "Novo pareamento"], bt_despareado: ["warn", "Pareamento removido"], bt_pareados_lista: ["info", "Lista de pareados"],
  volume_alterado: ["warn", "Volume alterado"], volume_corrigido: ["info", "Volume devolvido"], modo_som: ["warn", "Modo de som"],
  modo_aviao_ligado: ["crit", "Modo avião"], modo_aviao_desligado: ["info", "Modo avião desligado"],
  wifi_ligado: ["info", "Wi-Fi ligado"], wifi_desligado: ["warn", "Wi-Fi desligado"],
  dados_moveis_ligado: ["info", "Dados móveis ligados"], dados_moveis_desligado: ["crit", "Dados móveis desligados"],
  localizacao_ligada: ["info", "Localização ligada"], localizacao_desligada: ["warn", "Localização desligada"],
  protecao_tentativa: ["crit", "Tentaram remover o monitor"], protecao_desativada: ["crit", "Proteção desativada"],
  protecao_liberada: ["warn", "Remoção liberada (admin)"], protecao_ativada: ["info", "Proteção ativada"],
  desligando: ["warn", "Desligando"], carregador_conectado: ["info", "Na tomada"],
  carregador_desconectado: ["info", "Fora da tomada"], leitura_carregador: ["info", "Leitura do carregador"],
  desbloqueio: ["info", "Desbloqueio"], servico_iniciado: ["info", "Monitor iniciado"], resumo_dados: ["info", "Resumo de dados"]
};
const ALERT_TYPES = Object.keys(EVENT_INFO).filter(t => EVENT_INFO[t][0] !== "info");

const $ = s => document.querySelector(s);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmtTime = d => new Date(d).toLocaleString("pt-BR", { timeZone: TZ, day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
const fmtHour = d => new Date(d).toLocaleTimeString("pt-BR", { timeZone: TZ, hour: "2-digit", minute: "2-digit" });
const mb = b => b == null ? "–" : (b / 1048576).toLocaleString("pt-BR", { maximumFractionDigits: 1 }) + " MB";
const minsAgo = d => (Date.now() - new Date(d).getTime()) / 60000;
function ago(d) {
  const m = minsAgo(d);
  if (m < 1) return "agora";
  if (m < 60) return Math.round(m) + " min atrás";
  if (m < 1440) return Math.round(m / 60) + " h atrás";
  return Math.round(m / 1440) + " d atrás";
}

let mode = "demo", sb = null, fleet = [], alerts = [], filter = "todos", selected = null, unlocked = false;

// ------------------------------------------------------------------ fonte de dados
function conn() {
  const url = CONFIG.url || store.get("mf_url") || "";
  const key = CONFIG.key || store.get("mf_key") || "";
  return { url, key };
}

async function init() {
  const { url, key } = conn();
  if (url && key && window.supabase) {
    mode = "live";
    sb = window.supabase.createClient(url, key);
    if (!unlocked) { $("#dlgLogin").showModal(); return; }
    $("#btnLogout").hidden = false;
  } else {
    mode = "demo";
  }
  $("#demoBanner").hidden = mode !== "demo";
  await refresh();
}

async function refresh() {
  try {
    if (mode === "live") {
      const since = new Date(Date.now() - 864e5).toISOString();
      const [f, a, cfg] = await Promise.all([
        sb.from("v_last_sample").select("*").order("device_name"),
        sb.from("events").select("*").gte("ts", since).in("type", ALERT_TYPES).order("ts", { ascending: false }).limit(300),
        sb.from("device_config").select("device_id,config")
      ]);
      if (f.error) throw f.error;
      if (a.error) throw a.error;
      fleet = f.data; alerts = a.data;
      deviceConfig = {};
      if (!cfg.error) for (const r of cfg.data) deviceConfig[r.device_id] = r.config || {};
    } else {
      fleet = demo.fleet(); alerts = demo.alerts();
    }
    $("#meta").textContent = `${fleet.length} celulares · atualizado às ${fmtHour(new Date())} (horário de Paragominas)`;
    render();
    if (selected) openDetail(selected, $("#dDay")?.value);
  } catch (e) {
    $("#meta").textContent = "Erro ao ler os dados: " + (e.message || e) + ". Confira a conexão e se o usuário tem acesso.";
  }
}

async function loadDay(deviceId, day) {
  const start = new Date(day + "T00:00:00-03:00"), end = new Date(start.getTime() + 864e5);
  if (mode !== "live") return demo.day(deviceId, start);
  const samples = [];
  for (let from = 0; from < 5000; from += 1000) {
    const { data, error } = await sb.from("samples")
      .select("ts,battery_pct,plugged,current_ma,power_mw,voltage_mv,hotspot_on")
      .eq("device_id", deviceId).gte("ts", start.toISOString()).lt("ts", end.toISOString())
      .order("ts").range(from, from + 999);
    if (error) throw error;
    samples.push(...data);
    if (data.length < 1000) break;
  }
  const ev = await sb.from("events").select("*").eq("device_id", deviceId)
    .gte("ts", start.toISOString()).lt("ts", end.toISOString()).order("ts", { ascending: false }).limit(1000);
  if (ev.error) throw ev.error;
  return { samples, events: ev.data, start, end };
}

// ------------------------------------------------------------------ estado de cada celular
// limites globais (device_config '*'), com padrões; usados nos cartões e nos alertas
function glimits() {
  const g = (deviceConfig && deviceConfig["*"]) || {};
  return {
    minCur: g.min_current_ma ?? 300, minPower: g.min_power_mw ?? 0, minVolt: g.min_voltage_mv ?? 0,
    warnPct: g.batt_warn_pct ?? 20, critPct: g.batt_crit_pct ?? 10
  };
}
function chargeWeak(s, L) {
  L = L || glimits();
  if (!s.plugged || s.battery_pct >= 95) return false;
  return (s.current_ma != null && s.current_ma < L.minCur)
    || (L.minPower > 0 && s.power_mw != null && s.power_mw < L.minPower)
    || (L.minVolt > 0 && s.voltage_mv > 0 && s.voltage_mv < L.minVolt);
}
function assess(s) {
  const L = glimits();
  const m = minsAgo(s.ts);
  const issues = [];
  let signal = m <= ONLINE_MIN ? "online" : m <= LATE_MIN ? "atrasado" : "semsinal";
  if (signal === "semsinal") issues.push("crit");
  if (s.hotspot_on) issues.push("crit");
  if (chargeWeak(s, L)) issues.push("crit");
  if (!s.plugged && s.battery_pct != null && s.battery_pct <= L.warnPct) issues.push(s.battery_pct <= L.critPct ? "crit" : "warn");
  if (s.bt_on === false) issues.push("warn");
  const level = issues.includes("crit") ? "crit" : issues.length ? "warn" : "good";
  return { signal, level };
}

function render() {
  const rows = fleet.map(s => ({ s, a: assess(s) }));
  const n = k => rows.filter(k).length;
  const weak24 = new Set(alerts.filter(e => e.type === "carregador_fraco" || e.type === "nao_carrega").map(e => e.device_id)).size;
  $("#summary").innerHTML = [
    ["Online", n(r => r.a.signal === "online"), "good"],
    ["Sem sinal (> 1 h)", n(r => r.a.signal === "semsinal"), n(r => r.a.signal === "semsinal") ? "crit" : ""],
    ["Fora da tomada ≤ 20%", n(r => !r.s.plugged && r.s.battery_pct <= 20), n(r => !r.s.plugged && r.s.battery_pct <= 20) ? "warn" : ""],
    ["Hotspot ligado agora", n(r => r.s.hotspot_on), n(r => r.s.hotspot_on) ? "crit" : ""],
    ["Carregador com problema (24 h)", weak24, weak24 ? "crit" : ""]
  ].map(([l, v, c]) => `<div><span class="label">${l}</span><span class="v ${c}">${v}</span></div>`).join("");

  const q = $("#q").value.trim().toLowerCase();
  const shown = rows.filter(({ s, a }) => {
    if (q && !(`${s.device_name} ${s.device_id}`.toLowerCase().includes(q))) return false;
    if (filter === "atencao") return a.level !== "good";
    if (filter === "semsinal") return a.signal === "semsinal";
    if (filter === "hotspot") return s.hotspot_on;
    return true;
  }).sort((x, y) => ({ crit: 0, warn: 1, good: 2 }[x.a.level] - { crit: 0, warn: 1, good: 2 }[y.a.level]) || String(x.s.device_name).localeCompare(y.s.device_name));

  $("#grid").innerHTML = shown.length ? shown.map(({ s, a }) => card(s, a)).join("")
    : `<div class="empty">Nenhum celular neste filtro.</div>`;

  $("#feedCount").textContent = alerts.length ? alerts.length + " eventos" : "";
  $("#feed").innerHTML = alerts.length ? alerts.slice(0, 120).map(e => eventItem(e, true)).join("")
    : `<li class="empty" style="display:block">Nenhum alerta nas últimas 24 horas.</li>`;
}

function card(s, a) {
  const sig = { online: ["good", "online"], atrasado: ["warn", "atrasado"], semsinal: ["crit", "sem sinal"] }[a.signal];
  const pct = s.battery_pct ?? 0;
  const bcol = pct <= 15 ? "var(--crit)" : pct <= 30 ? "var(--warn)" : "var(--good)";
  const weak = chargeWeak(s);
  const charge = !s.plugged ? "fora da tomada"
    : s.current_ma == null ? `na tomada (${s.plug_type})`
    : `${s.current_ma} mA${s.power_mw != null ? " · " + (s.power_mw / 1000).toFixed(1) + " W" : ""}`;
  const hs = s.hotspot_on ? `LIGADO${s.hotspot_clients != null ? " · " + s.hotspot_clients + " aparelho(s)" : ""}` : "desligado";
  const bt = s.bt_on == null ? "sem dado" : s.bt_on ? (s.bt_connected ? "ligado · " + s.bt_connected : "ligado") : "desligado";
  return `<button type="button" class="card ${selected === s.device_id ? "sel" : ""}" data-id="${esc(s.device_id)}">
    <div class="head"><span class="name">${esc(s.device_name || s.device_id)}</span><span class="pill ${sig[0]}">${sig[1]}</span></div>
    <div class="batt"><div class="bar"><i style="width:${pct}%;background:${bcol}"></i></div><span class="pct">${s.battery_pct ?? "–"}%</span></div>
    <dl class="facts">
      <dt>Carga</dt><dd class="${weak ? "bad" : ""}">${esc(charge)}${weak ? " · fraco" : ""}</dd>
      <dt>Hotspot</dt><dd class="${s.hotspot_on ? "bad" : ""}">${esc(hs)}</dd>
      <dt>Bluetooth</dt><dd class="${s.bt_on === false ? "attn" : ""}">${esc(bt)}</dd>
      <dt>Pareados</dt><dd class="${s.bt_bonded_count != null && s.bt_bonded_count !== 1 ? "bad" : ""}">${s.bt_bonded_count == null ? "–" : s.bt_bonded_count + (s.bt_bonded_count === 1 ? " (ok)" : " — verificar!")}</dd>
      <dt>Dados hoje</dt><dd class="num">${mb(s.mobile_bytes_today)}${s.tether_bytes_today ? " · hotspot " + mb(s.tether_bytes_today) : ""}${s.wifi_bytes_today ? " · Wi-Fi " + mb(s.wifi_bytes_today) : ""}${s.usage_access === false ? ' <span class="attn">(sem Acesso ao uso)</span>' : ""}</dd>
      <dt>Volume</dt><dd class="num ${s.vol_media === 0 || s.vol_ring === 0 ? "attn" : ""}">mídia ${s.vol_media ?? "–"}% · toque ${s.vol_ring ?? "–"}%</dd>
    </dl>
    <span class="seen">Último dado ${fmtTime(s.ts)} (${ago(s.ts)})</span>
  </button>`;
}

function eventItem(e, withName) {
  const [sev, label] = EVENT_INFO[e.type] || ["info", e.type];
  return `<li><span class="sev ${sev}"></span><div>
    <div class="when">${fmtTime(e.ts)}${e.battery_pct != null ? " · bateria " + e.battery_pct + "%" : ""}</div>
    ${withName ? `<div class="who">${esc(e.device_name || e.device_id)} · ${esc(label)}</div>` : `<div class="who">${esc(label)}</div>`}
    <div class="msg">${esc(e.message)}</div></div></li>`;
}

function bindCalib(id) {
  const btn = $("#cbSave");
  if (!btn) return;
  btn.addEventListener("click", async () => {
    const cfg = Object.assign({}, deviceConfig[id] || {}, {
      current_unit: $("#cbUnit").value,
      current_invert: $("#cbInv").value === "1",
      min_current_ma: parseInt($("#cbMin").value, 10) || 300,
      force_volume: $("#cbVol").value === "1",
      volume_target_pct: parseInt($("#cbVolT").value, 10) || 100,
      force_bluetooth: $("#cbBt").value === "1"
    });
    $("#cbMsg").textContent = "Salvando…";
    const { error } = await sb.from("device_config").upsert({ device_id: id, label: fleet.find(x => x.device_id === id)?.device_name, config: cfg, updated_at: new Date().toISOString() });
    if (error) { $("#cbMsg").textContent = "Erro: " + error.message; return; }
    deviceConfig[id] = cfg;
    $("#cbMsg").textContent = "Salvo. O celular aplica em até 30 min ou ao reiniciar.";
  });
}

function dayChart({ samples, start, end }, W) {
  const L = 44, R = 12, H1 = 120, H2 = 110, gap = 34, T = 22;
  const x = t => L + (new Date(t) - start) / (end - start) * (W - L - R);
  const yB = v => T + H1 - v / 100 * H1;
  const cur = samples.map(p => p.current_ma).filter(v => v != null);
  let cMin = Math.min(0, ...cur, -200), cMax = Math.max(0, ...cur, 500);
  const step = cMax - cMin > 2500 ? 1000 : cMax - cMin > 1200 ? 500 : 250;
  cMin = Math.floor(cMin / step) * step; cMax = Math.ceil(cMax / step) * step;
  const top2 = T + H1 + gap;
  const yC = v => top2 + H2 - (v - cMin) / (cMax - cMin) * H2;
  // quebra a linha onde ha mais de 5 min sem amostra: ausencia de dado nao vira linha reta
  const segs = (key, y) => {
    let d = "", prev = null;
    for (const p of samples) {
      if (p[key] == null) { prev = null; continue; }
      const jump = !prev || (new Date(p.ts) - new Date(prev.ts)) > 5 * 60000;
      d += `${jump ? "M" : "L"}${x(p.ts).toFixed(1)} ${y(p[key]).toFixed(1)}`;
      prev = p;
    }
    return d;
  };
  const plugBands = [];
  let bandStart = null, lastTs = null;
  for (const p of samples) {
    if (p.plugged && bandStart == null) bandStart = p.ts;
    if ((!p.plugged || (lastTs && new Date(p.ts) - new Date(lastTs) > 5 * 60000)) && bandStart != null) { plugBands.push([bandStart, lastTs]); bandStart = p.plugged ? p.ts : null; }
    lastTs = p.ts;
  }
  if (bandStart != null) plugBands.push([bandStart, lastTs]);
  let g = "";
  for (let h = 0; h <= 24; h += 3) {
    const xx = L + h / 24 * (W - L - R);
    g += `<line x1="${xx}" x2="${xx}" y1="${T}" y2="${top2 + H2}" stroke="var(--chart-grid)"/><text x="${xx}" y="${top2 + H2 + 14}" text-anchor="middle">${String(h).padStart(2, "0")}h</text>`;
  }
  for (const v of [0, 50, 100]) g += `<line x1="${L}" x2="${W - R}" y1="${yB(v)}" y2="${yB(v)}" stroke="var(--chart-grid)"/><text x="${L - 6}" y="${yB(v) + 3.5}" text-anchor="end">${v}%</text>`;
  for (let v = cMin; v <= cMax; v += step) g += `<line x1="${L}" x2="${W - R}" y1="${yC(v)}" y2="${yC(v)}" stroke="${v === 0 ? "var(--muted)" : "var(--chart-grid)"}" ${v === 0 ? 'stroke-dasharray="3 3"' : ""}/><text x="${L - 6}" y="${yC(v) + 3.5}" text-anchor="end">${v}</text>`;
  const bands = plugBands.map(([a, b]) => `<rect x="${x(a)}" y="${T}" width="${Math.max(1, x(b) - x(a))}" height="${H1}" fill="var(--good-soft)"/>`).join("");
  const last = [...samples].reverse().find(p => p.battery_pct != null);
  return `<svg viewBox="0 0 ${W} ${top2 + H2 + 22}" role="img" aria-label="Bateria e corrente ao longo do dia">
    ${bands}${g}
    <path d="${segs("battery_pct", yB)}" fill="none" stroke="var(--accent)" stroke-width="2"/>
    <path d="${segs("current_ma", yC)}" fill="none" stroke="var(--warn)" stroke-width="1.3"/>
    ${last ? `<circle cx="${x(last.ts)}" cy="${yB(last.battery_pct)}" r="3.5" fill="var(--accent)"/>` : ""}
    <text x="${L}" y="${T - 8}" style="fill:var(--accent)">bateria % (faixa verde = na tomada)</text>
    <text x="${L}" y="${top2 - 8}" style="fill:var(--warn)">corrente mA (+ entrando na bateria)</text>
    ${samples.length ? "" : `<text x="${W / 2}" y="${T + H1 / 2}" text-anchor="middle">Sem amostras neste dia</text>`}
  </svg>`;
}

    base(4, { ts: new Date(now - 190 * m).toISOString(), battery_pct: 4, plugged: false, plug_type: "nenhum", battery_status: "descarregando", current_ma: -300, power_mw: -1050 }),

  ];
  const ev = (i, minAgo, type, message, pct) => ({ device_id: buses[i][1], device_name: buses[i][0], ts: new Date(now - minAgo * m).toISOString(), type, message, battery_pct: pct });
  const all = () => [
    ev(3, 14, "hotspot_clientes", "2 aparelho(s) respondendo no hotspot", 55),

    ev(5, 41, "volume_alterado", "Volume de midia abaixado: 60% -> 0%", 90),

    ev(1, 75, "carregador_fraco", "Carregador ligado mas corrente baixa: 120 mA (minimo 300 mA)", 63),
    ev(1, 78, "leitura_carregador", "Corrente apos 1 min no carregador: 140 mA (0.5 W na bateria)", 63),
    ev(1, 79, "carregador_conectado", "Colocado para carregar (usb) com 63%", 63),
    ev(2, 96, "bateria_baixa", "Bateria em 20% e fora do carregador", 20),
    ev(2, 180, "carregador_desconectado", "Retirado do carregador com 41%", 41),
    ev(4, 200, "bateria_critica", "Bateria em 10% e fora do carregador", 10),
    ev(0, 240, "bt_conectado", "Dispositivo Bluetooth conectado: JBL GO 3 (5C:FB:7C:12:9A:40)", 70),
    ev(0, 300, "desbloqueio", "Tela desbloqueada", 66)
  ];
  const alerts = () => all().filter(e => ALERT_TYPES.includes(e.type));
  function day(id, start) {
    const i = Math.max(0, buses.findIndex(b => b[1] === id));
    const f = fleet()[i], samples = [];

    const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
    const stop = Math.min(Date.now(), start.getTime() + 864e5);
    for (let t = start.getTime() + 5 * 3600e3; t < stop; t += 60000) {
      const h = (t - start.getTime()) / 3600e3;
      if (h > 12.2 && h < 12.9) continue; // sem sinal por ~40 min
      const plugged = (h > 6 && h < 11) || (h > 14.5 && i !== 2 && i !== 3);
      const cur = plugged ? (i === 1 ? 110 + rnd() * 40 : 1100 + rnd() * 400) : -(350 + rnd() * 300);

  }
  return { fleet, alerts, day };
})();

function switchView(v) {
  curView = v;
  document.querySelectorAll("#tabs .tab").forEach(t => t.setAttribute("aria-pressed", String(t.dataset.view === v)));
  $("#viewFrota").hidden = v !== "frota";
  $("#viewEventos").hidden = v !== "eventos";
  $("#viewConfig").hidden = v !== "config";
  if (v === "eventos") loadEventos();
  if (v === "config") renderConfig();
}

// ------------------------------------------------------------------ aba eventos (contagem + drill-down)
let evData = [], evSelected = null;
async function loadEventos() {
  const days = parseInt($("#evPeriod").value, 10) || 7;
  $("#evMeta").textContent = "carregando…";
  try {
    if (mode === "live") {
      const since = new Date(Date.now() - days * 864e5).toISOString();
      const rows = [];
      for (let from = 0; from < 20000; from += 1000) {
        const { data, error } = await sb.from("events").select("device_id,device_name,ts,type,message,battery_pct")
          .gte("ts", since).order("ts", { ascending: false }).range(from, from + 999);
        if (error) throw error;
        rows.push(...data);
        if (data.length < 1000) break;
      }
      evData = rows;
    } else {
      evData = demo.alerts();
    }
    $("#evMeta").textContent = `${evData.length} eventos nos últimos ${days} dia(s)`;
    renderEvCounts();
  } catch (e) {
    $("#evMeta").textContent = "Erro ao carregar: " + (e.message || e);
  }
}
function renderEvCounts() {
  const counts = {};
  for (const e of evData) counts[e.type] = (counts[e.type] || 0) + 1;
  const order = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
  $("#evCounts").innerHTML = order.length ? order.map(type => {
    const [sev, label] = EVENT_INFO[type] || ["info", type];
    const veh = new Set(evData.filter(e => e.type === type).map(e => e.device_id)).size;
    return `<button type="button" class="evcard ${evSelected === type ? "sel" : ""}" data-type="${esc(type)}">
      <span class="n ${sev}">${counts[type]}</span>
      <span class="lbl">${esc(label)}</span>
      <span class="sub">${veh} veículo(s)</span></button>`;
  }).join("") : `<div class="empty">Nenhum evento no período.</div>`;
  if (evSelected && counts[evSelected]) renderEvDetail(evSelected);
  else { $("#evDetail").hidden = true; evSelected = null; }
}
function renderEvDetail(type) {
  evSelected = type;
  document.querySelectorAll(".evcard").forEach(c => c.classList.toggle("sel", c.dataset.type === type));
  const rows = evData.filter(e => e.type === type);
  const [, label] = EVENT_INFO[type] || ["info", type];
  const byVeh = {};
  for (const e of rows) { const k = e.device_name || e.device_id; byVeh[k] = (byVeh[k] || 0) + 1; }
  const chips = Object.keys(byVeh).sort((a, b) => byVeh[b] - byVeh[a])
    .map(k => `<span>${esc(k)}: <strong>${byVeh[k]}</strong></span>`).join("");
  const body = rows.slice(0, 500).map(e => `<tr>
      <td>${esc(e.device_name || e.device_id)}</td>
      <td class="num">${fmtTime(e.ts)}</td>
      <td>${esc(e.message || "")}</td></tr>`).join("");
  const box = $("#evDetail");
  box.hidden = false;
  box.innerHTML = `<div class="dhead"><h2>${esc(label)} · ${rows.length}</h2>
      <button class="btn" type="button" id="evClose">Fechar</button></div>
    <span class="label">Por veículo</span><div class="byveh">${chips}</div>
    <span class="label">Ocorrências${rows.length > 500 ? " (mostrando as 500 mais recentes)" : ""}</span>
    <table><thead><tr><th>Veículo</th><th>Dia e hora</th><th>Descrição</th></tr></thead><tbody>${body}</tbody></table>`;
}

// ------------------------------------------------------------------ aba configurações (limites globais)
function renderConfig() {
  const g = (deviceConfig && deviceConfig["*"]) || {};
  const dis = mode !== "live" ? "disabled" : "";
  const num = (k, def) => g[k] ?? def;
  $("#cfgGlobal").innerHTML = `<div class="cfgcard">
    <span class="label">Limites padrão da frota (valem para todos os ônibus)</span>
    <p class="cfg-hint">Definem quando um celular "chama a atenção". Cada ônibus pode ter ajuste próprio na aba Frota, abrindo o detalhe dele. O celular aplica em até 30 min ou ao reiniciar.</p>
    <div class="cfggrid">
      <label>Bateria — atenção (%)<input type="number" id="gWarn" value="${num("batt_warn_pct", 20)}" ${dis}></label>
      <label>Bateria — crítico (%)<input type="number" id="gCrit" value="${num("batt_crit_pct", 10)}" ${dis}></label>
      <label>Corrente mínima (mA)<input type="number" id="gCur" value="${num("min_current_ma", 300)}" ${dis}></label>
      <label>Potência mínima (W)<input type="number" step="0.1" id="gPow" value="${(num("min_power_mw", 0) / 1000) || 0}" ${dis}></label>
      <label>Tensão mínima bateria (mV)<input type="number" id="gVolt" value="${num("min_voltage_mv", 0)}" ${dis}></label>
      <label>Volume alvo (%)<input type="number" id="gVolT" value="${num("volume_target_pct", 100)}" ${dis}></label>
      <label>Forçar volume alto<select id="gVolF" ${dis}><option value="0" ${g.force_volume ? "" : "selected"}>não</option><option value="1" ${g.force_volume ? "selected" : ""}>sim</option></select></label>
      <label>Religar Bluetooth (Android ≤12)<select id="gBt" ${dis}><option value="0" ${g.force_bluetooth ? "" : "selected"}>não</option><option value="1" ${g.force_bluetooth ? "selected" : ""}>sim</option></select></label>
    </div>
    <div class="cfg-hint">Potência e tensão em 0 = não verifica. Corrente abaixo do mínimo (ou potência/tensão abaixo, se definidas) marca "carregador fraco".</div>
    <div style="margin-top:12px"><button class="btn primary" type="button" id="gSave" ${dis}>Salvar limites</button>
      <span class="calib-note" id="gMsg">${mode === "live" ? "" : "Disponível ao conectar o Supabase."}</span></div>
  </div>`;
  const btn = $("#gSave");
  if (btn) btn.addEventListener("click", saveConfig);
}
async function saveConfig() {
  const g = Object.assign({}, deviceConfig["*"] || {}, {
    batt_warn_pct: parseInt($("#gWarn").value, 10) || 20,
    batt_crit_pct: parseInt($("#gCrit").value, 10) || 10,
    min_current_ma: parseInt($("#gCur").value, 10) || 0,
    min_power_mw: Math.round((parseFloat($("#gPow").value) || 0) * 1000),
    min_voltage_mv: parseInt($("#gVolt").value, 10) || 0,
    volume_target_pct: parseInt($("#gVolT").value, 10) || 100,
    force_volume: $("#gVolF").value === "1",
    force_bluetooth: $("#gBt").value === "1"
  });
  $("#gMsg").textContent = "Salvando…";
  const { error } = await sb.from("device_config").upsert({ device_id: "*", label: "Padrão da frota", config: g, updated_at: new Date().toISOString() });
  if (error) { $("#gMsg").textContent = "Erro: " + error.message; return; }
  deviceConfig["*"] = g;
  $("#gMsg").textContent = "Salvo. Os celulares aplicam em até 30 min ou ao reiniciar.";
}

// ------------------------------------------------------------------ interacoes
document.querySelectorAll("#tabs .tab").forEach(t => t.addEventListener("click", () => switchView(t.dataset.view)));
$("#evPeriod").addEventListener("change", loadEventos);
$("#evCounts").addEventListener("click", e => { const c = e.target.closest(".evcard"); if (c) renderEvDetail(c.dataset.type); });
$("#evDetail").addEventListener("click", e => { if (e.target.id === "evClose") { evSelected = null; $("#evDetail").hidden = true; renderEvCounts(); } });
$("#grid").addEventListener("click", e => { const c = e.target.closest(".card"); if (c) openDetail(c.dataset.id); });
$("#detail").addEventListener("change", e => { if (e.target.id === "dDay") openDetail(selected, e.target.value); });
$("#detail").addEventListener("click", e => { if (e.target.id === "dClose") { selected = null; $("#detail").hidden = true; render(); } });
$("#q").addEventListener("input", render);
document.querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => {
  filter = b.dataset.f;
  document.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  render();
}));
$("#btnRefresh").addEventListener("click", refresh);
$("#btnConfig").addEventListener("click", () => { const c = conn(); $("#cfgUrl").value = c.url; $("#cfgKey").value = c.key; $("#dlgConfig").showModal(); });
$("#formConfig").addEventListener("submit", () => { store.set("mf_url", $("#cfgUrl").value.trim()); store.set("mf_key", $("#cfgKey").value.trim()); init(); });
$("#cfgDemo").addEventListener("click", () => { store.set("mf_url", ""); store.set("mf_key", ""); $("#dlgConfig").close(); init(); });
$("#formLogin").addEventListener("submit", async e => {
  e.preventDefault();
  $("#loginErr").textContent = "";
  const code = $("#loginCode").value.trim();
  if (!(await codeOk(code))) { $("#loginErr").textContent = "Código incorreto."; return; }
  unlocked = true;
  $("#loginCode").value = "";
  $("#dlgLogin").close();
  init();
});
$("#btnLogout").addEventListener("click", () => { location.reload(); });
setInterval(() => { if (!document.hidden) refresh(); }, 60000);
init();
</script>
