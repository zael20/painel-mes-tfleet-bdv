<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Avaliar atendimento</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#17212b">
<style>
/* Pagina aberta pelo link do aviso "ocorrencia resolvida" no WhatsApp. O motorista da a nota (5 opcoes);
   Primeiro confere se e quem relatou (numero do WhatsApp ou matricula); depois a nota, uma vez so.
   Nota 3 ou menos pede o motivo e o que poderia ter sido melhor. */
:root { --bg: #eef1f4; --panel: #fff; --ink: #17212b; --muted: #5b6875; --line: #d5dce3; --accent: #0d6c8c; --accent-soft: #e0eff4; --good: #2e7d32; --good-soft: #e8f5e9; --crit: #c62828; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #11171d; --panel: #18212a; --ink: #e4eaf0; --muted: #93a1ae; --line: #2a3742; --accent: #4fb3d4; --accent-soft: #15303b; --good: #5cc98a; --good-soft: #15301f; --crit: #f07b72; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #11171d; --panel: #18212a; --ink: #e4eaf0; --muted: #93a1ae; --line: #2a3742; --accent: #4fb3d4; --accent-soft: #15303b; --good: #5cc98a; --good-soft: #15301f; --crit: #f07b72; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 "Segoe UI", system-ui, -apple-system, Arial, sans-serif; }
header { background: #17212b; color: #fff; padding: 16px; }
header small { color: #93a1ae; letter-spacing: .06em; font-size: 12px; }
header h1 { margin: 2px 0 0; font-size: 20px; }
main { max-width: 560px; margin: 0 auto; padding: 16px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
.muted { color: var(--muted); font-size: 14px; }
.caso { border-left: 3px solid var(--accent); padding: 2px 0 2px 12px; margin: 10px 0 4px; }
.caso b { display: block; }
fieldset { border: 0; padding: 0; margin: 18px 0 0; }
legend { font-weight: 700; margin-bottom: 8px; font-size: 18px; }
.opt { display: flex; align-items: center; gap: 12px; border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-bottom: 8px; cursor: pointer; min-height: 52px; }
.opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.opt input { width: 20px; height: 20px; accent-color: var(--accent); flex: none; }
.opt .cara { font-size: 24px; line-height: 1; width: 28px; text-align: center; }
.melhor { border: 1px solid var(--accent); border-radius: 8px; padding: 12px; margin-top: 4px; }
.melhor[hidden] { display: none; }
.melhor p { margin: 0 0 8px; font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 99px; padding: 8px 12px; font-size: 14px; cursor: pointer; }
.chip:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.chip input { accent-color: var(--accent); margin: 0; }
.vist { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-top: 10px; font-size: 14px; }
.vist ul { list-style: none; padding: 0; margin: 6px 0; display: grid; grid-template-columns: 1fr 1fr; gap: 2px 10px; }
.vist li::before { content: "✓ "; color: var(--good); font-weight: 700; }
.vist li.inok::before { content: "• "; color: var(--crit); }
.fotos { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; margin-top: 8px; }
.fotos img { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); display: block; }
.campo { width: 100%; font: inherit; font-size: 18px; padding: 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); margin-top: 10px; }
textarea { width: 100%; min-height: 90px; font: inherit; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); margin-top: 10px; }
button { width: 100%; margin-top: 14px; font-family: inherit; font-weight: 600; font-size: 16px; padding: 14px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; }
button:disabled { opacity: .6; }
.ok { background: var(--good-soft); color: var(--good); border-radius: 10px; padding: 16px; font-weight: 600; }
.err { color: var(--crit); margin-top: 10px; }
</style>
</head>
<body>
<header><small>TRANSPORTE · CELULAR DO ÔNIBUS</small><h1>Avaliar atendimento</h1></header>
<main><div id="app" class="card">Carregando…</div></main>
<script>
// Conexao publica do painel: a pagina so ve e avalia a ocorrencia do codigo do link.
const CONFIG = { url: "https://orhuxmsrdnugpogvtnbg.supabase.co", key: "sb_publishable_Hu4Ns0jDTesWzDmVseAl_Q_ubCJa5wL" };
const NOTAS = [[5, "😄", "Muito satisfeito"], [4, "🙂", "Satisfeito"], [3, "😐", "Parcialmente satisfeito"], [2, "🙁", "Pouco satisfeito"], [1, "😠", "Insatisfeito"]];
const MOTIVOS = [["demorou", "Demorou para resolver"], ["voltou", "O problema voltou / não foi resolvido"], ["provisorio", "Conserto provisório ou mal feito"],
  ["sem_retorno", "Ninguém explicou o que foi feito"], ["atendimento", "Atendimento / forma de tratar"], ["outro", "Outro motivo"]];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const dt = d => d ? new Date(d).toLocaleString("pt-BR", { timeZone: "America/Belem", day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }).replace(",", " às") : "";

// Antifraude: codigo guardado neste navegador + modelo do celular. Vai junto de cada tentativa, com o horario e o IP.
function aparelhoId() {
  try { let id = localStorage.getItem("tf_aparelho"); if (!id) { id = crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2); localStorage.setItem("tf_aparelho", id); } return id; }
  catch (e) { return null; }
}
async function aparelho() {
  const ua = navigator.userAgent, a = { id: aparelhoId(), ua, idioma: navigator.language, tela: screen.width + "x" + screen.height };
  const m = ua.match(/Android\s([\d.]+);\s*([^;)]+?)(?:\sBuild\/|\)|;)/);
  if (m) { a.sistema = "Android " + m[1]; if (m[2].trim() !== "K") a.modelo = m[2].trim(); }
  const ios = ua.match(/(iPhone|iPad).*?OS (\d+)/); if (ios) { a.modelo = ios[1]; a.sistema = "iOS " + ios[2]; }
  try {   // o Chrome novo esconde o modelo no texto acima, mas informa quando pedido
    if (navigator.userAgentData?.getHighEntropyValues) {
      const h = await navigator.userAgentData.getHighEntropyValues(["model", "platformVersion"]);
      if (h.model) a.modelo = h.model; if (h.platform === "Android" && h.platformVersion) a.sistema = "Android " + h.platformVersion.split(".")[0];
    }
  } catch (e) {}
  if (/^SM-/i.test(a.modelo || "")) a.marca = "Samsung"; else if (/moto/i.test(a.modelo || "")) a.marca = "Motorola";
  else if (/redmi|poco|^M\d{4}|^2\d{3}/i.test(a.modelo || "")) a.marca = "Xiaomi"; else if (ios) a.marca = "Apple";
  const nv = ua.match(/SamsungBrowser\/(\d+)/) ? "Samsung Internet " + ua.match(/SamsungBrowser\/(\d+)/)[1]
    : / wv\)/.test(ua) ? "navegador dentro de app" : ua.match(/Firefox\/(\d+)/) ? "Firefox " + ua.match(/Firefox\/(\d+)/)[1]
    : ua.match(/Chrome\/(\d+)/) ? "Chrome " + ua.match(/Chrome\/(\d+)/)[1] : ua.match(/Safari/) ? "Safari" : null;
  if (nv) a.navegador = nv;
  return a;
}
const AP = aparelho();

async function rpc(fn, body) {
  const r = await fetch(CONFIG.url + "/rest/v1/rpc/" + fn, { method: "POST",
    headers: { apikey: CONFIG.key, Authorization: "Bearer " + CONFIG.key, "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const txt = await r.text();
  if (!r.ok) { let m = txt; try { m = JSON.parse(txt).message || txt; } catch (e) {} throw new Error(m); }
  return txt ? JSON.parse(txt) : null;
}

(async () => {
  // link curto: a/?CODIGO  (o antigo avaliacao.html?t=CODIGO continua valendo)
  const token = (new URLSearchParams(location.search).get("t") || location.search.slice(1)).toLowerCase();
  if (!/^[0-9a-f]{12}$/.test(token)) { $("#app").textContent = "Link inválido. Abra pelo link da mensagem do WhatsApp."; return; }
  let c;
  try { c = await rpc("avaliacao_ver", { p_token: token }); } catch (e) { $("#app").textContent = "Não consegui carregar: " + e.message; return; }
  if (!c) { $("#app").textContent = "Ocorrência não encontrada."; return; }
  if (c.ja_avaliada) { $("#app").innerHTML = `<div class="ok">Essa ocorrência já foi avaliada. Obrigado!</div>`; return; }
  if (c.bloqueado) { $("#app").textContent = "Link bloqueado por tentativas erradas. Fale com a equipe do transporte."; return; }
  const vi = c.vistoria, ITENS = ["Aplicativo BDV", "Chip / internet", "Cabo / carregador", "Leitor", "Suporte", "Celular"];
  const caso = `<div class="caso"><b>Carro ${esc(c.tag || "?")} · ${esc(c.categoria)}</b>
      <span class="muted">${esc(c.problema || "")}</span>
      <div class="muted">${c.aberta_em ? "Aberta em " + dt(c.aberta_em) : ""}${c.resolvido_em ? " · resolvida em " + dt(c.resolvido_em) : ""}</div>
      ${c.solucao ? `<div style="margin-top:4px"><b style="display:inline">Solução:</b> ${esc(c.solucao)}</div>` : ""}</div>
    ${vi ? `<div class="vist"><b>O que foi visto na vistoria de ${dt(vi.ts)}</b>
      <ul>${ITENS.filter(k => vi.itens && vi.itens[k]).map(k => `<li class="${vi.itens[k] === "OK" ? "iok" : "inok"}">${k}: ${vi.itens[k] === "OK" ? "OK" : vi.feito ? "corrigido" : "com problema"}</li>`).join("")}</ul>
      ${vi.feito ? `<div><b style="display:inline">O que foi feito:</b> ${esc(vi.feito)}</div>` : ""}
      ${(vi.fotos || []).length ? `<div class="fotos">${vi.fotos.filter(u => /^https:\/\//.test(u)).map(u => `<a href="${esc(u)}" target="_blank" rel="noopener"><img src="${esc(u)}" alt="Foto da vistoria" loading="lazy"></a>`).join("")}</div>` : ""}
    </div>` : ""}`;
  // 1) quem esta avaliando: so quem relatou essa ocorrencia no grupo
  $("#app").innerHTML = `${caso}
    <form id="fi">
      <fieldset><legend>Quem está avaliando?</legend>
        <div class="muted">Só quem relatou essa ocorrência no grupo pode avaliar. Digite o seu número de WhatsApp com DDD (ou a sua matrícula).</div>
        <input id="ident" class="campo" type="text" inputmode="numeric" autocomplete="tel" maxlength="20" placeholder="Ex.: 91 99999-8888">
      </fieldset>
      <div class="muted" style="margin-top:8px;font-size:12px">Por segurança, registramos o celular usado, o horário e o IP de cada avaliação.</div>
      <button id="bi">Continuar</button>
      <div id="ei" class="err"></div>
    </form>`;
  $("#fi").addEventListener("submit", async e => {
    e.preventDefault();
    const ident = $("#ident").value.trim();
    if (ident.replace(/\D/g, "").length < 4) { $("#ei").textContent = "Digite seu número com DDD ou sua matrícula."; return; }
    $("#bi").disabled = true; $("#ei").textContent = "";
    try {
      const r = await rpc("avaliacao_identificar", { p_token: token, p_ident: ident, p_aparelho: await AP });
      if (!r.ok) { $("#bi").disabled = false; $("#ei").textContent = r.erro; return; }
      form(ident, r.nome);
    } catch (err) { $("#bi").disabled = false; $("#ei").textContent = "Não consegui conferir: " + err.message; }
  });
  // 2) a nota
  function form(ident, nome) {
    $("#app").innerHTML = `
    <div>${nome ? esc(nome) + ", conte" : "Conte"} pra gente como foi a solução do seu relato.</div>
    ${caso}
    <form id="f">
      <fieldset><legend>Como você avalia a solução?</legend>
        ${NOTAS.map(([v, e, t]) => `<label class="opt"><input type="radio" name="n" value="${v}"><span class="cara" aria-hidden="true">${e}</span>${t}</label>`).join("")}
      </fieldset>
      <div class="melhor" id="melhor" hidden>
        <p>O que poderia ter sido feito melhor?</p>
        <div class="chips">${MOTIVOS.map(([k, t]) => `<label class="chip"><input type="checkbox" name="m" value="${k}">${t}</label>`).join("")}</div>
        <textarea id="obs" maxlength="1000" placeholder="Ex.: o suporte continuou solto, podia ter trocado"></textarea>
      </div>
      <div class="muted" style="margin-top:12px">A avaliação é uma só e não pode ser mudada depois.</div>
      <button id="b">Enviar avaliação</button>
      <div id="e" class="err"></div>
    </form>`;
    const nota = () => +($('input[name="n"]:checked')?.value || 0);
    $("#f").addEventListener("change", e => { if (e.target.name === "n") $("#melhor").hidden = nota() > 3; $("#e").textContent = ""; });
    $("#f").addEventListener("submit", async e => {
      e.preventDefault();
      const n = nota(), obs = $("#obs").value.trim(), ms = n <= 3 ? [...document.querySelectorAll('input[name="m"]:checked')].map(x => x.value) : [];
      if (!n) { $("#e").textContent = "Escolha uma das opções."; return; }
      if (n <= 3 && !ms.length && !obs) { $("#e").textContent = "Marque um motivo ou escreva o que poderia ter sido melhor."; $("#obs").focus(); return; }
      $("#b").disabled = true; $("#b").textContent = "Enviando…"; $("#e").textContent = "";
      try {
        const r = await rpc("avaliacao_responder", { p_token: token, p_ident: ident, p_nota: n, p_motivos: ms, p_observacao: n <= 3 ? obs || null : null, p_aparelho: await AP });
        if (!r.ok) throw new Error(r.erro);
        $("#app").innerHTML = `<div class="ok">Avaliação registrada. Obrigado!</div>
          <p class="muted">${esc(NOTAS.find(x => x[0] === n)[2])}${n <= 3 ? ". Sua resposta ajuda a melhorar a vistoria dos celulares." : "."}</p>`;
      } catch (err) { $("#b").disabled = false; $("#b").textContent = "Enviar avaliação"; $("#e").textContent = "Não enviou: " + err.message; }
    });
  }
})();
</script>
</body>
</html>
